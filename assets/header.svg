<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Dasha · Frontend Developer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A0A0A"/>
      <stop offset="0.55" stop-color="#9D174D"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <style>
      .title { font: 800 88px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #FFFFFF; letter-spacing: 1px; }
      .sub   { font: 500 24px "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; fill: #F2F2F2; letter-spacing: 1px; }
      .code  { font: 700 130px "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; fill: #FFFFFF; opacity: .07; }
      .in    { opacity: 0; animation: in 1s ease-out forwards; }
      .d2    { animation-delay: .25s; }
      .d3    { animation-delay: .5s; }
      .cur   { animation: blink 1.1s steps(1) infinite; }
      @keyframes in    { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>
  <rect width="1200" height="260" rx="22" fill="url(#bg)"/>
  <text class="code" x="28" y="190">&lt;/&gt;</text>
  <text class="code" x="985" y="190">{ }</text>
  <text class="title in" x="600" y="125" text-anchor="middle">Dasha</text>
  <text class="sub in d2" x="600" y="177" text-anchor="middle">Frontend Developer · React &amp; TypeScript</text>
  <rect class="in d3" x="560" y="203" width="80" height="4" rx="2" fill="#FBCFE8"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
