  <g class="in" style="animation-delay:0.35s"><rect x="757" y="197" width="103" height="36" rx="18" fill="#EC4899" fill-opacity=".14" stroke="#EC4899" stroke-opacity=".7"/><text class="chip" x="808.5" y="220" text-anchor="middle">Testing</text></g>
  <g class="in" style="animation-delay:0.35s"><rect x="870" y="197" width="175" height="36" rx="18" fill="#EC4899" fill-opacity=".14" stroke="#EC4899" stroke-opacity=".7"/><text class="chip" x="957.5" y="220" text-anchor="middle">Best practices</text></g>

  <text class="lbl in" style="animation-delay:0.5s" x="450" y="270">LANGUAGES</text>
  <g class="in" style="animation-delay:0.55s"><rect x="450" y="282" width="124" height="36" rx="18" fill="#EC4899" fill-opacity=".14" stroke="#EC4899" stroke-opacity=".7"/><text class="chip" x="512.0" y="305" text-anchor="middle">Ukrainian</text></g>
  <g class="in" style="animation-delay:0.55s"><rect x="584" y="282" width="103" height="36" rx="18" fill="#EC4899" fill-opacity=".14" stroke="#EC4899" stroke-opacity=".7"/><text class="chip" x="635.5" y="305" text-anchor="middle">Russian</text></g>
  <g class="in" style="animation-delay:0.55s"><rect x="697" y="282" width="103" height="36" rx="18" fill="#EC4899" fill-opacity=".14" stroke="#EC4899" stroke-opacity=".7"/><text class="chip" x="748.5" y="305" text-anchor="middle">English</text></g>
  <g class="in" style="animation-delay:0.55s"><rect x="810" y="282" width="83" height="36" rx="18" fill="#EC4899" fill-opacity=".14" stroke="#EC4899" stroke-opacity=".7"/><text class="chip" x="851.5" y="305" text-anchor="middle">Czech</text></g>

  <text class="lbl in" style="animation-delay:0.7s" x="450" y="355">PASSIONATE ABOUT</text>
  <text class="txt in" style="animation-delay:.75s" x="450" y="387">Clean, responsive interfaces and thoughtful user experiences</text>
  <text class="txt in" style="animation-delay:.8s" x="450" y="415">Writing maintainable code</text>

  <line x1="40" y1="436" x2="1160" y2="436" stroke="#262626"/>
  <text class="goal in" style="animation-delay:.9s" x="600" y="467" text-anchor="middle">“Keep growing as a developer and build products people love.”</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
