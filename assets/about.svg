  <g class="in" style="animation-delay:0.15s"><rect x="543" y="112" width="103" height="36" rx="18" fill="#EC4899" fill-opacity=".14" stroke="#EC4899" stroke-opacity=".7"/><text class="chip" x="594.5" y="135" text-anchor="middle">Next.js</text></g>
