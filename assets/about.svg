  <g class="in" style="animation-delay:0.15s"><rect x="944" y="112" width="83" height="36" rx="18" fill="#EC4899" fill-opacity=".14" stroke="#EC4899" stroke-opacity=".7"/><text class="chip" x="985.5" y="135" text-anchor="middle">UI/UX</text></g>

  <text class="lbl in" style="animation-delay:0.3s" x="450" y="185">CURRENTLY LEARNING</text>
