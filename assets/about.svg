<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" width="1200" height="490" role="img" aria-label="About Daria: Frontend Developer and UI/UX designer in Prague. Focus: React, Next.js, TypeScript. Languages: Ukrainian, Russian, English, Czech." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EC4899"/><stop offset=".5" stop-color="#9D174D"/><stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="av" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F472B6"/><stop offset="1" stop-color="#9D174D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1">
      <stop offset="0" stop-color="#EC4899" stop-opacity=".35"/><stop offset="1" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <style>
      .lbl  { font: 600 14px "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; fill: #F472B6; letter-spacing: 3px; }
      .chip { font: 500 17px "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; fill: #FCE7F3; }
      .txt  { font: 400 20px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #F5F5F5; }
      .name { font: 800 32px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #FFFFFF; }
      .role { font: 500 16px "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; fill: #F9A8D4; }
      .loc  { font: 400 16px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #A3A3A3; }
      .goal { font: italic 400 20px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #F9A8D4; }
      .avl  { font: 800 72px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #FFFFFF; }
      .win  { font: 500 14px "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; fill: #737373; }
      .in   { animation: in .8s ease-out backwards; }
      @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="488" rx="24" fill="#0A0A0A" stroke="url(#edge)" stroke-width="2"/>
  <circle cx="190" cy="190" r="330" fill="url(#glow)"/>

  <circle cx="40" cy="36" r="6" fill="#EC4899"/><circle cx="62" cy="36" r="6" fill="#F9A8D4"/><circle cx="84" cy="36" r="6" fill="#525252"/>
  <text class="win" x="108" y="41">about.me</text>
  <line x1="1" y1="64" x2="1199" y2="64" stroke="#262626"/>

  <g class="in">
    <circle cx="190" cy="180" r="86" fill="none" stroke="url(#edge)" stroke-width="3" stroke-dasharray="6 8"/>
    <circle cx="190" cy="180" r="72" fill="url(#av)"/>
    <text class="avl" x="190" y="206" text-anchor="middle">D</text>
